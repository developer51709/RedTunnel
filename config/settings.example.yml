# RedTunnel Configuration Example
# Copy this file to settings.yml and fill in your actual credentials

# Environment: development, staging, production, testing
environment: development

# Debug mode
debug: true

# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_level: DEBUG

# Cloudflare Configuration
cloudflare:
  # Your Cloudflare API token
  # Create at: https://dash.cloudflare.com/profile/api-tokens
  api_token: "your_api_token_here"
  
  # Your Cloudflare Account ID
  # Found in Cloudflare Dashboard > Overview
  account_id: "your_account_id_here"
  
  # Your Cloudflare Zone ID
  # Found in Cloudflare Dashboard > Select Zone > Overview
  zone_id: "your_zone_id_here"

# Simulation Settings
simulation:
  # Maximum number of requests to make
  max_requests: 100
  
  # Request timeout in seconds
  timeout: 30
  
  # Delay between requests in seconds
  delay_between_requests: 1.0

# UI Settings
ui:
  # Use NerdFont icons if available
  use_nerdfont: true
  
  # Use colors in terminal
  use_color: true
  
  # Use Unicode characters
  use_unicode: true
  
  # Theme: default, dark, light, minimal
  theme: default